<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payrate Calculator</title>
<meta name="description" content="Log your jobs, hours and pay rate. Works fully offline.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--APP-START-->
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Payrate</span>
    </div>
    <div class="top-actions">
      <span class="offline-chip" title="All data stays on this device">Offline</span>
      <button class="nav-icon" data-action="compose" id="new-job" aria-label="Add a shift or a job" title="Add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12 14.8l-3.6.8.8-3.6z"/></svg>
      </button>
      <div class="menu pop" id="compose-menu" role="menu" hidden>
        <button class="menu-row" role="menuitem" data-action="add-shift" id="m-add-shift">
          <span class="mr-main"><span>Add shift</span><small>Log hours worked at one of your jobs</small></span></button>
        <button class="menu-row" role="menuitem" data-action="new-profile" id="m-add-job">
          <span class="mr-main"><span>Add job</span><small>A new place or role you work</small></span></button>
      </div>
    </div>
  </header>

  <main>
    <section id="view-home" class="view" aria-label="Home"></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-jobs" class="view" aria-label="Jobs" hidden></section>
    <section id="view-settings" class="view" aria-label="Settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-action="tab" data-tab="home" id="tab-home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-action="tab" data-tab="history" id="tab-history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-action="tab" data-tab="jobs" id="tab-jobs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg>
      <span>Jobs</span>
    </button>
    <button class="tab" data-action="tab" data-tab="settings" id="tab-settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-7-4-7 4z"/></svg>
      <span>Holidays</span>
    </button>
  </nav>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<!--APP-END-->
<script src="storage.js"></script>
<script src="holidays-au.js"></script>
<script src="app.js"></script>
<script src="install.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
